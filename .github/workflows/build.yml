name: Build Android (tests + APK debug)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android          # racine Gradle réelle du projet
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (Temurin) — exigé par AGP 8.x
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Rendre gradlew exécutable (robustesse, indépendant du poste de dev)
        run: chmod +x gradlew

      - name: Diagnostic — versions réellement utilisées
        run: |
          java -version
          ./gradlew --version

      - name: Tests unitaires (:app:testDebugUnitTest — 51 attendus)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Diagnostic — résumé des échecs de tests (si échec)
        if: failure()
        run: |
          find app/build/test-results -name "*.xml" | head -10 || true
          grep -h "<failure\|<error" app/build/test-results/testDebugUnitTest/*.xml | head -20 || true

      - name: Publier les rapports de tests (même en échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: android/app/build/reports/tests/
          if-no-files-found: warn

      - name: Compilation APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    # Publication signée : déclenchement MANUEL uniquement (Actions → Build Android → Run workflow),
    # après avoir ajouté les 4 secrets du dépôt (procédure pas-à-pas : docs/08_PUBLICATION_PLAY.md).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Rendre gradlew exécutable (robustesse)
        run: chmod +x gradlew

      - name: Décoder le keystore (secret KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent — voir docs/08_PUBLICATION_PLAY.md §2"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/godson-release.keystore"

      - name: Build release signé (APK + AAB)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/godson-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Publier l'APK release signé
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publier l'AAB release signé (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
