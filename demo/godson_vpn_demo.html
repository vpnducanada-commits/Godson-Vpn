<html lang="fr">

<title>Godson VPN — Maquette de référence (démo)</title>
<style>
  /* ═══ Design system Godson VPN v2 — Premium Cybersecurity ═══ */
  :root{
    --bg:#07111F; --surface:#0B1730; --panel:#0F1D3C; --line:rgba(145,160,184,.18);
    --txt:#F5F8FF; --muted:#91A0B8; --blue:#246BFD; --blue2:#1A56D6; --cyan:#21D4FD;
    --green:#25D695; --amber:#FFB547; --red:#FF5364;
    --r-s:10px; --r-m:16px; --r-l:20px;
  }
  body.light{
    --bg:#EFF4FD; --surface:#FFFFFF; --panel:#E6EEFB; --line:rgba(11,23,48,.14);
    --txt:#0B1730; --muted:#5A6B85;
  }
  *{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:#03080F; color:var(--txt); font-size:15px; line-height:1.5}
  #phone{max-width:430px; margin:0 auto; min-height:100dvh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; box-shadow:0 0 70px rgba(33,212,253,.05)}
  .pad{padding:0 20px}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .muted{color:var(--muted)} .small{font-size:12.5px} .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  h1{font-size:22px; font-weight:700} h2{font-size:16px; font-weight:600}

  #demobadge{position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:90;
    background:rgba(255,181,71,.10); border:1px solid rgba(255,181,71,.45); color:var(--amber);
    font-size:10.5px; padding:4px 12px; border-radius:999px; letter-spacing:.5px; white-space:nowrap}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:16px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; flex:1}
  .tile .k{font-size:11px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; font-weight:600}
  .tile .v{font-size:15px; font-weight:600; margin-top:3px}
  .badge-demo{display:inline-flex; border:1px solid rgba(255,181,71,.55); color:var(--amber);
    font-size:10px; font-weight:700; letter-spacing:1px; padding:2px 8px; border-radius:999px}

  .topbar{display:flex; align-items:center; gap:10px; padding:14px 20px 10px}
  .brand{font-weight:800; letter-spacing:2.6px; font-size:13px}
  .iconbtn{width:38px; height:38px; border-radius:12px; display:inline-flex; align-items:center;
    justify-content:center; background:var(--surface); border:1px solid var(--line); color:var(--muted)}
  .svc{display:inline-flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:6px 11px; font-size:11.5px; color:var(--muted)}
  .svc .dot{width:8px; height:8px; border-radius:50%}

  .connectzone{position:relative; height:330px; display:flex; align-items:center; justify-content:center}
  .netbg{position:absolute; inset:0; pointer-events:none}
  .bigbtn{position:relative; width:196px; height:196px; border-radius:50%; z-index:2;
    background:radial-gradient(circle at 50% 32%, var(--panel), var(--surface) 72%);
    border:1.4px solid; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; transition:border-color .35s, box-shadow .5s; cursor:pointer}
  .bigbtn:active{transform:scale(.96)}
  .rings{position:absolute; width:246px; height:246px; pointer-events:none}
  .bicon{color:var(--blue)} .blabel{font-size:13.5px; font-weight:600; text-align:center; padding:0 18px}
  .bigbtn.st-disconnected{border-color:rgba(145,160,184,.45); box-shadow:0 0 40px rgba(33,212,253,.06)}
  .bigbtn.st-disconnected .bicon,.bigbtn.st-disconnected .blabel{color:var(--blue)}
  .bigbtn.st-connecting,.bigbtn.st-preparing,.bigbtn.st-reconnecting,.bigbtn.st-disconnecting{border-color:rgba(33,212,253,.55)}
  .bigbtn.st-connecting .bicon,.bigbtn.st-connecting .blabel{color:var(--cyan)}
  .bigbtn.st-connected{border-color:rgba(37,214,149,.6); box-shadow:0 0 52px rgba(37,214,149,.13)}
  .bigbtn.st-connected .bicon,.bigbtn.st-connected .blabel{color:var(--green)}
  .bigbtn.st-error,.bigbtn.st-unavailable{border-color:rgba(255,83,100,.55)}
  .bigbtn.st-error .bicon,.bigbtn.st-error .blabel,.bigbtn.st-unavailable .bicon{color:var(--red)}
  @keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{opacity:.35} 50%{opacity:.8}}

  .statusline{font-size:15px; font-weight:600; text-align:center; padding:0 30px}
  .hintline{font-size:12.5px; color:var(--muted); text-align:center; padding:6px 34px 0}

  .btn{display:block; width:100%; padding:14px; border-radius:var(--r-m); font-weight:700; font-size:14.5px;
    text-align:center; background:linear-gradient(90deg,var(--blue),var(--blue2)); color:#fff; transition:transform .12s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface); border:1px solid var(--line); color:var(--txt); font-weight:600}
  .btn.danger{background:var(--red)}
  .btn.small{width:auto; padding:10px 16px; font-size:13px}

  .chiprow{display:flex; gap:8px; padding:10px 0 6px; overflow-x:auto; scrollbar-width:none}
  .chip{padding:8px 13px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
    background:var(--surface); border:1px solid var(--line); color:var(--muted)}
  .chip.on{background:rgba(36,107,253,.2); border-color:rgba(36,107,253,.7); color:var(--blue)}
  .search{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-m); padding:12px 14px; margin-top:4px}
  .search input{flex:1; background:none; border:none; color:var(--txt); font:inherit; outline:none; min-width:0}
  .slist{display:flex; flex-direction:column; gap:9px; padding:10px 0 90px}
  .srow{display:flex; align-items:center; gap:11px; text-align:left; width:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:13px 14px;
    transition:transform .12s, border-color .25s, background .25s; animation:cardin .24s both}
  .srow:active{transform:scale(.985)}
  .srow.selected{border-color:rgba(36,107,253,.8); background:rgba(36,107,253,.10)}
  .srow.soon{opacity:.62}
  @keyframes cardin{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
  .flag{font-size:26px; width:42px; flex:none; text-align:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  .flag.small{font-size:20px; width:32px}
  .meta{flex:1; min-width:0}
  .meta .name{font-weight:600; font-size:14.5px}
  .meta .sub{font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta .st{display:flex; align-items:center; gap:6px; margin-top:3px; font-size:11.5px; font-weight:600}
  .sdot{width:7px; height:7px; border-radius:50%}
  .heart{color:var(--muted); padding:6px; border-radius:10px}
  .heart.on{color:var(--red)}
  .ping{text-align:right; font-weight:600; color:var(--cyan); font-size:14px}
  .ping small{display:block; color:var(--amber); font-size:9.5px; letter-spacing:.6px; font-weight:700}
  .selcheck{color:var(--blue); flex:none}

  .skel{height:74px; border-radius:var(--r-m); background:var(--surface); border:1px solid var(--line);
    position:relative; overflow:hidden}
  .skel::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,
    rgba(145,160,184,.14) 50%, transparent 70%); animation:shimmer 1.1s infinite}
  @keyframes shimmer{from{transform:translateX(-100%)} to{transform:translateX(100%)}}

  .nav{position:sticky; bottom:0; margin-top:auto; display:flex; background:var(--surface);
    border-top:1px solid var(--line); padding:7px 8px calc(9px + env(safe-area-inset-bottom)); z-index:50}
  .navitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px;
    color:var(--muted); font-size:11px; border-radius:14px; transition:color .22s}
  .navitem .ind{width:22px; height:3px; border-radius:2px; background:transparent; transition:background .22s}
  .navitem.on{color:var(--cyan)} .navitem.on .ind{background:var(--cyan)}

  .subhead{display:flex; align-items:center; gap:6px; padding:12px 16px 2px}
  .subhead h1{font-size:21px; flex:1}
  .subhead .sub{font-size:13px; color:var(--muted); padding:2px 20px 8px}
  .backbtn{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--muted)}
  .sect{font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); font-weight:700; margin:20px 24px 8px}
  .setrow{display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; text-align:left}
  .setrow .ic{width:38px; height:38px; border-radius:10px; background:rgba(36,107,253,.14);

  .setrow .lab{flex:1; min-width:0}
  .setrow .lab .t{font-size:14.5px} .setrow .lab .d{font-size:12px; color:var(--muted); margin-top:2px}
  .switch{width:46px; height:27px; border-radius:999px; background:var(--panel); border:1px solid var(--line);
    position:relative; flex:none; transition:background .2s, border-color .2s}
  .switch::after{content:''; position:absolute; top:2.5px; left:3px; width:20px; height:20px; border-radius:50%;
    background:var(--muted); transition:all .2s}
  .switch.on{background:rgba(36,107,253,.4); border-color:var(--blue)}
  .switch.on::after{left:21px; background:var(--cyan)}
  select{background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font:inherit}
  .themepick{display:flex; gap:6px}
  .themepick button{padding:6px 10px; border-radius:999px; font-size:12px; font-weight:600;
    background:var(--panel); border:1px solid var(--line); color:var(--muted)}
  .themepick button.on{background:rgba(36,107,253,.18); border-color:rgba(36,107,253,.7); color:var(--blue)}

  .faq{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
  .faq .q{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 16px; font-weight:600; font-size:14.5px; width:100%; text-align:left}
  .faq .a{max-height:0; overflow:hidden; transition:max-height .25s ease, padding .25s ease; padding:0 16px; color:var(--muted); font-size:13.5px}
  .faq.open .a{max-height:260px; padding:0 16px 15px}
  .faq .q svg{transition:transform .25s} .faq.open .q svg{transform:rotate(180deg)}

  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px}
  .brandname{font-size:22px; font-weight:800; letter-spacing:5.5px; margin-top:24px}
  .tagline{color:var(--muted); font-size:13px; margin-top:8px; letter-spacing:.3px}
  .prog{width:120px; height:3px; border-radius:2px; background:var(--panel); overflow:hidden; margin-top:36px}
  .prog i{display:block; height:100%; width:40%; background:var(--cyan); border-radius:2px; animation:load 1.3s ease forwards}
  @keyframes load{from{width:5%} to{width:100%}}
  .dots{display:flex; gap:7px; justify-content:center; padding:14px 0}
  .dots i{width:8px; height:8px; border-radius:999px; background:var(--line); transition:all .22s}
  .dots i.on{width:22px; background:var(--cyan)}

  #toasts{position:fixed; bottom:52px; left:50%; transform:translateX(-50%); z-index:95; display:flex; flex-direction:column; gap:8px; width:min(92vw,390px)}
  .toast{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:11px 15px;
    font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.45); animation:tin .24s ease}
  .toast.ok{border-color:rgba(37,214,149,.5)} .toast.err{border-color:rgba(255,83,100,.55)} .toast.warn{border-color:rgba(255,181,71,.55)}
  @keyframes tin{from{opacity:0; transform:translateY(8px)}}
  .overlay{position:fixed; inset:0; background:rgba(3,8,15,.72); z-index:80; display:flex; align-items:center; justify-content:center; padding:24px}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; max-width:400px; width:100%}

  .screen{animation:screenin .24s ease both}
  @keyframes screenin{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  body.no-anim *, body.no-anim *::before, body.no-anim *::after{animation:none !important; transition:none !important}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important}}
  code{background:var(--panel); padding:2px 7px; border-radius:6px; font-size:12px; color:var(--amber)}
</style>
</head>

/* ── Machine à états (miroir de VpnStateMachine.kt) ────────────────────── */
const NEXT = {
 disconnected:{connecting:1},
 preparing:{awaiting:1, connecting:1, error:1},
 awaiting:{connecting:1, disconnected:1},
 connecting:{connected:1, reconnecting:1, error:1, disconnecting:1},
 connected:{disconnecting:1, reconnecting:1},
 reconnecting:{connected:1, disconnecting:1, error:1},
 disconnecting:{disconnected:1, error:1},
 error:{disconnected:1, connecting:1}
};
function setState(v){ if(!NEXT[S.vpn] || !NEXT[S.vpn][v]) return; S.vpn=v; render(); }

function connect(){
  const c = ctry();
  if(!connectable(c)){ toast(t('stSoon')+' — '+cname(c), 'err'); return; }
  if(S.simOffline){ toast(t('errMsg'),'err'); return; }
  if(S.vpn!=='disconnected' && S.vpn!=='error') return;
  setState('connecting');
  setTimeout(()=>{
    if(S.simError){ setState('error'); toast(t('errMsg'),'err'); }
    else{
      S.vpn='connected';
      S.session={dur:0};
      S.recents=[c.code, ...S.recents.filter(x=>x!==c.code)].slice(0,5);
      LS.set('recents', S.recents);
      render();
      toast('SIMULATION — ' + t('on'), 'warn');
    }
  }, 2200);
}
function doDisconnect(){
  setState('disconnecting');
  setTimeout(()=>{
    const dur = S.session.dur;
    if(dur>0){ S.hist.unshift({code:S.country, dur}); S.hist=S.hist.slice(0,12); }
    setState('disconnected');
  }, 850);
}
function disconnect(){
  if(S.confirmDisc){
    openModal('<h2>'+t('discT')+'</h2><p class="muted small" style="margin:10px 0 18px">'+t('discB')+'</p>'
     +'<div class="row"><button class="btn ghost small" data-close="1">'+t('cancel')+'</button>'
     +'<button class="btn danger small" data-act="confirmDisc">'+t('discOk')+'</button></div>');
  } else doDisconnect();
}

function filteredCountries(){
  const q = S.q.trim().toLowerCase();
  let list = COUNTRIES.filter(c=>{
    if(S.cat==='fav' && !S.favs[c.code]) return false;
    if(S.cat==='recent' && !S.recents.includes(c.code)) return false;
    if(S.region && c.region!==S.region) return false;
    if(S.availOnly && !connectable(c)) return false;
    if(q){
      const hay = (cname(c)+' '+c.name.en+' '+(ccity(c)||'')+' '+c.code).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const cmpName = (a,b)=> cname(a).toLowerCase() < cname(b).toLowerCase() ? -1 : 1;
  list = list.slice().sort((a,b)=>{
    if(rank(a)!==rank(b)) return rank(a)-rank(b);
    if(S.sortLat){
      const pa = a.ping??9999, pb = b.ping??9999;
      if(pa!==pb) return pa-pb;
    }
    return cmpName(a,b);
  });
  return list;
}

function chartSVG(){

  const max = Math.max(...data.map(d=>d.dur), 1);

  let svg = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%; height:96px">';
  data.forEach((d,i)=>{
    const bh = Math.max(4, (d.dur/max)*(h-14));
    svg += '<rect x="'+(i*bw+bw*0.28).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+(bw*0.44).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="url(#gchart)"/>';
  });
  svg += '<defs><linearGradient id="gchart" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#246BFD"/><stop offset="1" stop-color="#21D4FD"/></linearGradient></defs></svg>';
  return svg;
}

       + '<p class="muted small" style="margin-top:12px">'+t('timelineEmpty')+'</p></div>')
   + '<p class="small muted" style="padding:4px 2px 12px">'+t('privacyNote')+'</p></div>' + nav();
}
function sw(key, on){ return '<button class="switch '+(on?'on':'')+'" data-act="toggle" data-key="'+key+'" role="switch" aria-checked="'+on+'"></button>'; }
function setrow(icon, label, desc, ctrl){ return '<div class="setrow"><span class="ic">'+icon+'</span>'
 + '<span class="lab"><span class="t">'+label+'</span>'+(desc?'<span class="d">'+desc+'</span>':'')+'</span>'+ctrl+'</div>'; }
function vSettings(){
  return subhead(t('setTitle'), t('tagline'), true)
   + '<div class="pad" style="padding-bottom:96px">'
   + '<div class="sect" style="margin-left:0">'+t('secGeneral')+'</div>'
   + '<div class="card" style="padding:4px">'
   + setrow(ICON.gear, t('theme'), '', '<span class="themepick">'
     + '<button class="'+(S.theme==='dark'?'on':'')+'" data-act="setTheme" data-v="dark">'+t('thDark')+'</button>'
     + '<button class="'+(S.theme==='light'?'on':'')+'" data-act="setTheme" data-v="light">'+t('thLight')+'</button></span>')
   + setrow(ICON.chart, t('reduce'), t('reduceD'), sw('reduce', S.reduce))
   + setrow(ICON.lock, 'Langue', '', '<select data-set="lang">'
     + [['fr','Français'],['en','English'],['pt','Português']].map(o=>'<option value="'+o[0]+'"'+(S.lang===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>')
   + '</div>'
   + '<div class="sect" style="margin-left:0">'+t('secConn')+'</div>'
   + '<div class="card" style="padding:4px">'
   + setrow(ICON.shield, t('confirmD'), t('confirmDD'), sw('confirmDisc', S.confirmDisc))
   + setrow(ICON.bug, t('simErrorL'), '('+t('simSec')+')', sw('simError', S.simError))
   + setrow(ICON.dns, t('simOfflineL'), '('+t('simSec')+')', sw('simOffline', S.simOffline))
   + '</div>'
   + '<div class="sect" style="margin-left:0">'+t('secData')+'</div>'
   + '<div class="card" style="padding:4px">'
   + setrow(ICON.lock, t('rowPrivacy'), t('rowPrivacyD'), '<button data-act="goPrivacy" style="color:var(--muted)">'+ICON.chev+'</button>')
   + '</div>'
   + '<div class="sect" style="margin-left:0">'+t('secHelp')+'</div>'
   + '<div class="card" style="padding:4px">'
   + setrow(ICON.check, t('rowSupport'), t('rowSupportD'), '<button data-act="goSupport" style="color:var(--muted)">'+ICON.chev+'</button>')
   + setrow(ICON.person, t('rowProfile'), t('rowProfileD'), '<button data-act="goProfile" style="color:var(--muted)">'+ICON.chev+'</button>')
   + '</div>'
   + '<div class="sect" style="margin-left:0">'+t('secAbout')+'</div>'
   + '<div class="card" style="padding:4px">'
   + setrow(ICON.gear, t('version'), '', '<span class="small muted">0.3.0-phase2 · maquette</span>')
   + '</div></div>' + nav();
}
function vPrivacy(){
  return subhead(t('pTitle'), t('pSub'), true)
   + '<div class="pad" style="padding-bottom:96px">'
   + '<div class="sect" style="margin-left:0">'+t('tunnelState')+'</div>'
   + '<div class="card"><div class="row" style="justify-content:flex-start; gap:10px">'
   + '<span class="sdot" style="background:'+statusColor(S.vpn)+'"></span>'
   + '<span style="font-weight:600; color:'+statusColor(S.vpn)+'">'+statusText(S.vpn)+'</span></div></div>'
   + '<div class="sect" style="margin-left:0">'+t('protections')+'</div>'
   + '<div class="card" style="padding:4px">'
   + setrow(ICON.dns, t('pr1'), t('pr1d'), '')
   + setrow(ICON.globe, t('pr2'), t('pr2d'), '')
   + setrow(ICON.check, t('pr3'), t('pr3d'), ICON.check)
   + setrow(ICON.shield, t('pr4'), t('pr4d'), ICON.check)
   + '</div>'
   + '<div class="sect" style="margin-left:0">'+t('dataT')+'</div>'
   + '<div class="card"><p class="small muted">'+t('dataB')+'</p>'
   + '<div class="row" style="margin-top:12px; justify-content:flex-start; gap:6px; flex-wrap:wrap">'
   + '<button class="btn ghost small" data-act="policy" style="display:inline-flex;align-items:center;gap:7px">'+ICON.lock+' '+t('policyAction')+'</button>'
   + '<button class="btn ghost small" data-act="clearData" style="color:var(--red)">'+t('clearData')+'</button></div></div></div>';
}
function vSupport(){
  return subhead(t('supTitle'), t('supSub'), true)
   + '<div class="pad" style="padding-bottom:96px">'
   + '<div class="sect" style="margin-left:0">'+t('faqTitle')+'</div>'
   + '<div style="display:flex; flex-direction:column; gap:8px">'
   + T.fr.faq.map((_,i)=>{
     const q = T[S.lang].faq[i].q, a = T[S.lang].faq[i].a;
     return '<div class="faq'+(S.faqOpen===i?' open':'')+'"><button class="q" data-act="faq" data-v="'+i+'">'+esc(q)+ICON.chevD+'</button>'
     + '<div class="a">'+esc(a)+'</div></div>'; }).join('')
   + '</div>'
   + '<div class="sect" style="margin-left:0">'+t('diag')+'</div>'
   + '<div class="card">'
   + '<div class="row" style="padding:4px 0"><span class="small muted">'+t('dApp')+'</span><span class="small">0.3.0-phase2</span></div>'
   + '<div class="row" style="padding:4px 0"><span class="small muted">'+t('dDev')+'</span><span class="small">'+esc(navigator.userAgent.split(') ').pop().split(' ').slice(0,2).join(' '))+'</span></div>'
   + '<div class="row" style="padding:4px 0"><span class="small muted">'+t('dNet')+'</span><span class="small" style="color:'+(navigator.onLine?'var(--green)':'var(--red)')+'">'+(navigator.onLine? t('dOn') : t('dOff'))+'</span></div>'
   + '<div class="row" style="padding:4px 0"><span class="small muted">'+t('dVpn')+'</span><span class="small" style="color:'+statusColor(S.vpn)+'">'+statusText(S.vpn)+'</span></div>'
   + '<button class="btn ghost small" data-act="copyDiag" style="margin-top:10px">'+t('diagCopy')+'</button></div>'
   + '<div class="sect" style="margin-left:0">'+t('repT')+'</div>'
   + '<div class="card"><p class="small muted">'+t('repB')+'</p>'
   + '<button class="btn ghost small" data-act="report" style="margin-top:12px">'+ICON.bug+' '+t('repT')+'</button></div></div>';
}
function vProfile(){
  if(!S.device){ S.device = 'gv-'+Math.random().toString(36).slice(2,10)+'-'+Math.random().toString(36).slice(2,10); LS.set('device', S.device); }
  const masked = S.device.slice(0,10)+'…'+S.device.slice(-4);
  return subhead(t('proTitle'), null, true)
   + '<div class="pad" style="padding-bottom:96px">'
   + '<div class="sect" style="margin-left:0">'+t('noAcc')+'</div>'
   + '<div class="card"><div class="row" style="justify-content:flex-start; gap:14px; align-items:flex-start">'
   + '<span class="ic" style="width:44px;height:44px;border-radius:12px;background:rgba(36,107,253,.14);display:flex;align-items:center;justify-content:center;color:var(--cyan)">'+ICON.person+'</span>'
   + '<div><div style="font-weight:600">'+t('noAcc')+'</div>'
   + '<p class="small muted" style="margin-top:6px">'+t('noAccB')+'</p></div></div></div>'
   + '<div class="sect" style="margin-left:0">'+t('devId')+'</div>'
   + '<div class="card"><code>'+masked+'</code>'
   + '<div class="row" style="margin-top:12px; justify-content:flex-start; gap:6px">'
   + '<button class="btn ghost small" data-act="copyId" style="display:inline-flex;align-items:center;gap:7px">'+ICON.copy+' '+t('copy')+'</button>'
   + '<button class="btn ghost small" data-act="resetId">'+t('resetId')+'</button></div></div>'
   + '<div class="sect" style="margin-left:0">'+t('future')+'</div>'
   + '<div class="card"><p class="small muted">'+t('futureB')+'</p></div></div>';
}
function subhead(title, subtitle, back, trailing){
  return '<div class="subhead">'+(back? '<button class="backbtn" data-act="back" aria-label="back">'+ICON.back+'</button>' : '')
   + '<h1>'+title+'</h1>'+(trailing||'')+'</div>'
   + (subtitle? '<div class="sub">'+subtitle+'</div>' : '');
}
function render(){
  document.body.classList.toggle('light', S.theme==='light');
  document.body.classList.toggle('no-anim', S.reduce);
  document.documentElement.lang = S.lang;
  const v = {splash:vSplash, onboarding:vOnboarding, dashboard:vDashboard, countries:vCountries,
    stats:vStats, settings:vSettings, privacy:vPrivacy, support:vSupport, profile:vProfile}[S.view];
  $('#phone').innerHTML = '<div class="screen" style="display:flex;flex-direction:column;min-height:100dvh">'+v()+'</div>';
  const q = $('#q');
  if(q){ q.addEventListener('input', e=>{ S.q=e.target.value;
    const list = filteredCountries();
    const wrap = document.querySelector('.slist');
    if(wrap){ wrap.innerHTML = list.length? list.map((c,i)=>countryRow(c,i)).join('')
      : '<div class="center"><h2>'+t('eSearchT')+'</h2><p class="muted small" style="margin-top:8px">'+t('eSearchB')+'</p></div>'; }
  });}
}

/* ── Événements ────────────────────────────────────────────────────────── */
document.addEventListener('click', e=>{
  const closer = e.target.closest('[data-close]');
  if(closer){ closeModal(); if(closer.dataset.act!=='confirmDisc') return; }
  const el = e.target.closest('[data-act]');
  if(!el){ if(e.target.classList && e.target.classList.contains('overlay')) closeModal(); return; }
  if(e.target.closest('[data-stop]')) return;
  const a = el.dataset.act;
  switch(a){
    case 'skipOb': S.view='dashboard'; LS.set('onboarded', true); render(); break;
    case 'nextOb': if(S.ob<2){ S.ob++; render(); } else { S.view='dashboard'; LS.set('onboarded', true); render(); } break;
    case 'go': S.view=el.dataset.v; render(); break;
    case 'back': if(!['dashboard','countries','stats','settings'].includes(S.view)){ S.view='settings'; render(); } break;
    case 'goCountries': S.view='countries'; render(); break;
    case 'goSettings': S.view='settings'; render(); break;
    case 'goPrivacy': S.view='privacy'; render(); break;
    case 'goSupport': S.view='support'; render(); break;
    case 'goProfile': S.view='profile'; render(); break;
    case 'connect': connect(); break;
    case 'disconnect': disconnect(); break;
    case 'confirmDisc': closeModal(); doDisconnect(); break;
    case 'errDetails': openModal('<h2>'+t('error')+'</h2><p class="small muted" style="margin:12px 0">'+t('errMsg')+'</p><code>SIMULATED_TUNNEL_FAILURE (démo)</code><div style="margin-top:18px"><button class="btn ghost" data-close="1">'+t('close')+'</button></div>'); break;
    case 'pick': { const c = COUNTRIES.find(x=>x.code===el.dataset.id);
      if(!c) break;
      if(c.st==='soon'){ toast(t('stSoon')+' — '+cname(c)); break; }
      if(c.st==='unavail'){ toast(t('stUnavail')+' — '+cname(c), 'err'); break; }
      S.country=c.code; LS.set('country', c.code);
      S.recents=[c.code, ...S.recents.filter(x=>x!==c.code)].slice(0,5);
      LS.set('recents', S.recents);
      render(); toast(t('selToast')+' — '+c.flag+' '+cname(c), 'ok');
      setTimeout(()=>{ if(S.view==='countries'){ S.view='dashboard'; render(); } }, 480);
      break; }
    case 'fav': { const id=el.dataset.id; S.favs[id]=!S.favs[id]; if(!S.favs[id]) delete S.favs[id];
      LS.set('favs', S.favs); render(); break; }
    case 'cat': S.cat=el.dataset.v; render(); break;
    case 'region': S.region=el.dataset.v||null; render(); break;
    case 'availOnly': S.availOnly=!S.availOnly; render(); break;
    case 'sortAlpha': S.sortLat=false; render(); break;
    case 'sortLat': S.sortLat=true; render(); break;
    case 'refresh': S.loading=true; render();
      setTimeout(()=>{ S.loading=false; S.firstLoad=false; render(); }, 650); break;
    case 'toggle': { const k=el.dataset.key; S[k]=!S[k]; LS.set(k, S[k]); render();
      if(k==='reduce') toast(t('reduce')+' : '+(S[k]?'ON':'OFF')); break; }
    case 'setTheme': S.theme=el.dataset.v; LS.set('theme', S.theme); render(); break;
    case 'clearHist': openModal('<h2>'+t('clearT')+'</h2><p class="muted small" style="margin:10px 0 18px">'+t('clearB')+'</p>'
      +'<div class="row"><button class="btn ghost small" data-close="1">'+t('cancel')+'</button>'
      +'<button class="btn danger small" data-act="clearHistOk">'+t('ok')+'</button></div>'); break;
    case 'clearHistOk': S.hist=[]; closeModal(); render(); toast(t('cleared'),'ok'); break;
    case 'clearData': openModal('<h2>'+t('clearDataT')+'</h2><p class="muted small" style="margin:10px 0 18px">'+t('clearDataB')+'</p>'
      +'<div class="row"><button class="btn ghost small" data-close="1">'+t('cancel')+'</button>'
      +'<button class="btn danger small" data-act="clearDataOk">'+t('ok')+'</button></div>'); break;
    case 'clearDataOk': ['lang','theme','reduce','confirm','simError','simOffline','favs','recents','country','device','faqOpen','onboarded']
        .forEach(k=>localStorage.removeItem('gv_'+k));
      location.reload(); break;
    case 'policy': openModal('<h2>'+t('policyT')+'</h2><p class="small muted" style="margin:12px 0">'+t('policyB')+'</p>'
      +'<button class="btn ghost" data-close="1">'+t('close')+'</button>'); break;
    case 'faq': S.faqOpen = (S.faqOpen===Number(el.dataset.v))? -1 : Number(el.dataset.v); render(); break;
    case 'copyDiag': copyText(diagText()); break;
    case 'report': openModal('<h2>'+t('repT')+'</h2><p class="small muted" style="margin:12px 0">'+t('repB')+'</p>'
      +'<button class="btn" data-act="copyDiag2">'+t('diagCopy')+'</button>'); break;
    case 'copyDiag2': copyText(diagText()); closeModal(); break;
    case 'copyId': copyText(S.device||''); break;
    case 'resetId': S.device='gv-'+Math.random().toString(36).slice(2,10)+'-'+Math.random().toString(36).slice(2,10);
      LS.set('device', S.device); render(); toast(t('resetDone'),'ok'); break;
  }
});
function copyText(txt){
  const done=()=>toast(t('copied'),'ok');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(done); }
  else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(_){ } ta.remove(); done(); }
}
function diagText(){
  return 'Godson VPN — diagnostic (maquette, données non sensibles)\n'
   + 'Version : 0.3.0-phase2\nNavigateur : '+navigator.userAgent+'\n'
   + 'Réseau : '+(navigator.onLine? 'en ligne':'hors ligne')+'\nÉtat du tunnel : '+S.vpn+' (simulation)';
}
document.addEventListener('change', e=>{
  if(e.target.dataset && e.target.dataset.set==='lang'){ S.lang=e.target.value; LS.set('lang', S.lang); render(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.act==='pick'){ e.target.click(); }
});

/* ── Horloge de session (1 Hz — seulement pendant la connexion) ────────── */
setInterval(()=>{
  if(S.vpn!=='connected') return;
  S.session.dur++;
  const d=$('#durv'); if(d) d.textContent=fmtDur(S.session.dur);
},1000);

/* ── Démarrage : splash ~1,4 s, skeletons du catalogue en arrière-plan ──── */
render();
setTimeout(()=>{ S.loading=false; }, 650);
setTimeout(()=>{ if(S.view==='splash'){
  S.view = LS.get('onboarded', false) ? 'dashboard' : 'onboarding';
  S.ob=0; render();
}},1400);
</script>
</body>
</html>
